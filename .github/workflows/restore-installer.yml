name: Restore installer spec from private release
on:
  push:
    branches: [review/english-only]
    paths: ['.github/workflows/restore-installer.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/english-only
      - name: Download original verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/backup"
          gh release download v1.0.0 -R "$GITHUB_REPOSITORY" -p 'gamehoctienganh.zip' -D "$RUNNER_TEMP/backup"
          echo "31ba4b5e769cc8fdef7c681a63507bc960ca3bb890b3dd5058b17a5d0711d617  $RUNNER_TEMP/backup/gamehoctienganh.zip" | sha256sum -c -
      - name: Restore packaging source
        env:
          ZIP_PATH: ${{ runner.temp }}/backup/gamehoctienganh.zip
        run: |
          python - <<'PY'
          import os,pathlib,zipfile
          with zipfile.ZipFile(os.environ["ZIP_PATH"]) as z:
            filename="gamehoctienganh/English_Quest_Codex_Kit/packaging/installer.iss"
            body=z.read(filename)
          target=pathlib.Path("project/packaging/installer.iss")
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(body)
          print("Restored",target,len(body),"bytes")
          PY
      - name: Commit recovered installer config to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/packaging/installer.iss
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore Windows installer source from original backup"
            git push origin HEAD:review/english-only
          fi
