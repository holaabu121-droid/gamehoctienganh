name: Verify Grade 6 exercise application
on:
  push:
    branches: [review/english-only, feature/grade6-multisubject, feature/math6-lesson2-v01]
    paths: ['project/**', '.github/workflows/test-english-only.yml']
  pull_request:
    branches: [main, review/english-only]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: project/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run frontend tests
        run: npm test
      - name: Compile frontend production bundle
        run: npm run build
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r project/backend/requirements.txt
      - name: Run backend unit tests
        working-directory: project
        run: python -m unittest discover -s backend/tests -v
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate two English semesters plus Math Lessons 1–2
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("project")
          cat=json.loads((p/"data/curriculum/catalog.json").read_text())
          assert [x["id"] for x in cat["courses"]]==["english-6-semester-1","english-6-semester-2","math-6-semester-1"]
          assert [x["subject"] for x in cat["courses"]]==["english","english","math"]
          app=(p/"frontend/src/App.tsx").read_text()
          for s in ["Math6Semester1Experience","Informatics6Experience","Vietnamese6Experience","Science6Experience"]:
            assert s not in app,s
          for dir in ["science6","vietnamese6","informatics6"]:
            assert not (p/"frontend/src/features"/dir).exists(),dir
          math=(p/"frontend/public/math6-bai1/index.html").read_text()
          assert math.count('"KN1-')+math.count('"KN2-')>=50
          assert "math6-bai2-v01" in cat["courses"][2]["branch_ids"]
          assert (p/"frontend/public/math6-bai2/questions.mjs").exists()
          assert (p/"frontend/src/features/math6/Math6Lesson1Experience.tsx").is_file()
          print("PASS: two English semesters and Math Lesson 1; other subjects absent")
          PY

  browser:
    # Playwright 1.58 chromium is supported on Ubuntu 24.04, not runner 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: project/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend and browser test dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: One full regression pass on mobile and desktop
        run: node tests/mathLesson2.browser.mjs
