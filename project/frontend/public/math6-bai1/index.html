/* Toán 6 Bài 1 – grading and quiz generator, usable offline and in Node. */
(function (root, factory) {
  const engine = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = engine;
  root.QuizEngine = engine;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  const MAX_SCORE = 100;
  const FREE_SECONDS = 10;
  const INTERVAL_SECONDS = 10;
  const LIMIT_SECONDS = 110;

  function normalize(value) {
    return String(value ?? '').normalize('NFKC')
      .replace(/[“”]/g, '"').replace(/\u00a0/g, ' ')
      .trim().replace(/\s+/g, ' ').toLocaleLowerCase('vi-VN');
  }
  function compact(value) { return normalize(value).replace(/\s+/g, ''); }
  function setTokens(raw, requiredName) {
    // Accept a list with or without { }, optionally prefixed by A= (etc).
    // Reject partial parses: "A={1;2} and 3" and wrong set labels are not valid.
    const whole=String(raw ?? '').normalize('NFKC').trim();
    const match=whole.match(/^(?:([A-Za-z])\s*=\s*)?(?:\{([^{}]*)\}|([^{}]*))$/u);
    if (!match) return null;
    if (match[1] && requiredName && normalize(match[1])!==normalize(requiredName)) return null;
    const values=match[2]===undefined?match[3]:match[2];
    if (/[{}=]/u.test(values)) return null;
    const pieces=values.split(/[;,]/);
    if (pieces.some(x=>!x.trim())) return null; // reject missing/empty list elements
    const tokens=pieces.map(normalize);
    if (!tokens.length || new Set(tokens).size!==tokens.length) return null;
    return tokens.sort();
  }
  function fieldCorrect(field, input) {
    // Some mathematical descriptions are semantically equivalent. For a
    // statement-selection field we grade the selected indexes, not prose.
    if(field.kind==='selectStatements') {
      if(!Array.isArray(input) || !Array.isArray(field.expected))return false;
      const selected=input.map(Number).sort((a,b)=>a-b);
      const expected=[...field.expected].sort((a,b)=>a-b);
      return selected.length===expected.length && new Set(selected).size===selected.length &&
        selected.every((item,i)=>item===expected[i]);
    }
    const v=String(input ?? '').trim();
    if (!v) return false;
    const accepted=[field.expected,...(field.aliases || [])];
    if (field.kind==='set') {
      const a=setTokens(v,field.setName), b=setTokens(field.expected,field.setName);
      return Boolean(a && b && a.length===b.length && a.every((x,i)=>x===b[i]));
    }
    if (field.kind==='membership') {
      return accepted.some(a=>compact(v)===compact(a));
    }
    return accepted.some(a=>compact(v)===compact(a));
  }
  function grade(question, response) {
    const config=question.interaction;
    if (!config || !response) return false;
    if (config.kind==='single') return response.choice !== null && response.choice !== undefined && Number(response.choice)===config.correct;
    if (config.kind==='multi'||config.kind==='diagram') {
      if(!Array.isArray(response.selected)) return false;
      const a=[...new Set(response.selected.map(Number))].sort((x,y)=>x-y);
      const b=[...config.correct].sort((x,y)=>x-y);
      return a.length===b.length && a.every((x,i)=>x===b[i]);
    }
    if (config.kind==='sort') {
      if(!Array.isArray(response.buckets)||response.buckets.length!==config.options.length) return false;
      const alternatives=[config.correct,...(config.alternateCorrect||[])];
      return alternatives.some(indices=>response.buckets.every((b,i)=>b===(indices.includes(i)?'in':'out')));
    }
    if (config.kind==='match') {
      if(!Array.isArray(response.matches)||response.matches.length!==config.left.length) return false;
      return response.matches.every((x,i)=>x!==null && x!==undefined && x!=='' && Number(x)===config.correct[i]);
    }
    if (config.kind==='text') {
      if(!Array.isArray(response.fields)||response.fields.length!==config.fields.length) return false;
      return config.fields.every((field,i)=>fieldCorrect(field,response.fields[i]));
    }
    return false;
  }
  function penalty(elapsedSeconds) {
    return Math.min(100,Math.floor(Math.max(0,elapsedSeconds-FREE_SECONDS)/INTERVAL_SECONDS)*10);
  }
  function pointScore(seconds,wrongAnswers) {
    if(wrongAnswers>=2 || seconds>=LIMIT_SECONDS) return 0;
    return Math.max(0,MAX_SCORE-penalty(seconds)-(wrongAnswers>0?50:0));
  }
  function rng() {
    if(typeof crypto!=='undefined' && crypto.getRandomValues) {
      const buf=new Uint32Array(1);crypto.getRandomValues(buf);return buf[0]/4294967296;
    }
    return Math.random();
  }
  function shuffle(values,rand=rng) {
    const copy=[...values];for(let i=copy.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}return copy;
  }
  function draw(group,count,recent,rand) {
    const fresh=shuffle(group.filter(q=>!recent.includes(q.id)),rand);
    if(fresh.length>=count)return fresh.slice(0,count);
    const recycled=shuffle(group.filter(q=>recent.includes(q.id)),rand);
    return [...fresh,...recycled].slice(0,count);
  }
  function newQuiz(bank,knowledge,recent=[],rand=rng) {
    const group=bank.filter(q=>q.knowledge===knowledge);
    const practice=group.filter(q=>q.level==='Luyện tập');
    const application=group.filter(q=>q.level==='Vận dụng');
    if(practice.length!==15||application.length!==10)throw new Error('Ngân hàng kiến thức phải có 15 luyện tập và 10 vận dụng.');
    const selected=shuffle([...draw(practice,6,recent,rand),...draw(application,4,recent,rand)],rand);
    if(new Set(selected.map(q=>q.id)).size!==10)throw new Error('Đề kiểm tra bị trùng câu.');
    return selected;
  }
  function emptyAnswer(interaction) {
    if(interaction.kind==='single')return {choice:null};
    if(interaction.kind==='multi'||interaction.kind==='diagram')return {selected:[]};
    if(interaction.kind==='sort')return {buckets:interaction.options.map(()=>null)};
    if(interaction.kind==='match')return {matches:interaction.left.map(()=>null)};
    return {fields:interaction.fields.map(f=>f.kind==='selectStatements'?[]:'')};
  }
  function report(results) {
    const total=results.reduce((s,r)=>s+r.score,0);
    return {total,max:results.length*100,percent:results.length?Math.round(total/results.length):0,
      zeroAfterSecondError:results.filter(r=>r.mistakes>=2).length,
      earned:results.filter(r=>r.score>0).length};
  }
  return {normalize,compact,setTokens,fieldCorrect,grade,penalty,pointScore,newQuiz,emptyAnswer,report,FREE_SECONDS,LIMIT_SECONDS};
});

</script>

  <script>
/* Toán 6 – Bài 1, interactive/offline question bank v0.5.4 */
(function () {
  'use strict';
  const E=window.QuizEngine;
  const BANK=window.QUESTIONS;
  const studentKey = new URLSearchParams(window.location.search).get('student');
  const validStudent = studentKey && /^[A-Za-z0-9_-]{6,64}$/.test(studentKey) ? studentKey : null;
  // Separate unfinished tests, learning cards, and history for each local account.
  const STORE='toan6.bai1.v05.progress' + (validStudent ? '.student.'+validStudent : '');
  function sendCompletion(knowledge, results) {
    if(!validStudent || window.parent === window)return;
    const questionScores = results.map(row=>row.score);
    if(questionScores.length!==10 || questionScores.some(x=>!Number.isInteger(x)||x<0||x>100))return;
    window.parent.postMessage({
      source:'math6-bai1-v054', kind:'quiz-completed', student:validStudent,
      knowledge, questionScores, earnedScore:questionScores.reduce((a,b)=>a+b,0)
    },window.location.origin);
  }
  const app=document.querySelector('#app');
  const escapeHTML=(text)=>String(text??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const sec=(ms)=>ms/1000;
  function fresh(){return {version:1,mode:'home',learned:[false,false],quiz:null,recent:{1:[],2:[]},history:{1:[],2:[]}};}
  function readState(){
    try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(!s||s.version!==1)return fresh();
      if(s.quiz && s.mode==='quiz') { const rec=s.quiz.records[s.quiz.ids[s.quiz.index]];
        if(rec && rec.status==='answering')rec.status='paused'; }
      return s;
    }catch{return fresh();}
  }
  let state=readState();let startTick=0;
  // Quick symbols must target the last answer field the pupil selected.
  let lastFocusedFieldIndex=null;
  const persist=()=>{try{localStorage.setItem(STORE,JSON.stringify(state));}catch(err){console.warn('Không thể lưu tiến độ cục bộ:',err);}};
  const byId=id=>BANK.find(q=>q.id===id);
  const getRecord=()=>state.quiz?.records?.[state.quiz.ids[state.quiz.index]];
  const current=()=>byId(state.quiz.ids[state.quiz.index]);
  const elapsed=()=>{const r=getRecord();if(!r)return 0;return r.elapsedMs+(r.status==='answering'&&startTick?Date.now()-startTick:0);};
  function syncTime(){
    const r=getRecord();if(!r)return;
    if(r.status==='answering'&&startTick){r.elapsedMs+=Math.max(0,Date.now()-startTick);startTick=0;}
    if(sec(r.elapsedMs)>=E.LIMIT_SECONDS && !r.solved){r.elapsedMs=E.LIMIT_SECONDS*1000;r.timedOut=true;r.status='coaching';r.score=0;}
  }
  function resume(){const r=getRecord();if(!r||r.solved)return;
    // Returning to a paused question preserves the child's typed choices;
    // only a retry after a graded mistake clears the previous answer.
    const wasPaused=r.status==='paused';
    if(r.timedOut||r.mistakes>=2){r.status='coaching';startTick=0;}
    else {r.status='answering';startTick=Date.now();}
    if(!wasPaused)r.response=E.emptyAnswer(current().interaction);
    persist();render();
  }
  function stopForHint(){syncTime();startTick=0;}
  function begin(knowledge){
    if(!state.learned.every(Boolean))return;
    // Prevent accidental replacement of the only locally saved unfinished quiz.
    if(state.quiz && state.quiz.ids.some(id=>!state.quiz.records[id].solved)
      && !window.confirm('Đề hiện tại chưa hoàn thành. Tạo đề mới sẽ thay thế đề đang làm. Tiếp tục?'))return;
    const list=E.newQuiz(BANK,knowledge,state.recent[knowledge]||[]);
    state.recent[knowledge]=list.map(q=>q.id);
    state.quiz={knowledge,ids:list.map(q=>q.id),index:0,createdAt:new Date().toISOString(),records:{}};
    list.forEach(q=>state.quiz.records[q.id]={mistakes:0,helpCount:0,extraTries:0,elapsedMs:0,timedOut:false,solved:false,score:null,status:'answering',response:E.emptyAnswer(q.interaction)});
    state.mode='quiz';startTick=Date.now();persist();render();
  }
  function updateAnswer(kind,arg,val){
    const r=getRecord();if(!r||r.status!=='answering'&&r.status!=='coaching')return;
    const response=r.response;
    if(kind==='choice')response.choice=Number(arg);
    if(kind==='selected'){
      const item=Number(arg);const old=response.selected.indexOf(item);
      if(old<0)response.selected.push(item);else response.selected.splice(old,1);
    }
    if(kind==='bucket')response.buckets[Number(arg)]=val;
    if(kind==='match')response.matches[Number(arg)]=val===''?null:Number(val);
    if(kind==='field')response.fields[Number(arg)]=val;
    if(kind==='fieldStatement'){
      const fieldIndex=Number(arg), optionIndex=Number(val);
      const selection=Array.isArray(response.fields[fieldIndex])?response.fields[fieldIndex]:[];
      const selected=selection.indexOf(optionIndex);
      if(selected<0)selection.push(optionIndex);else selection.splice(selected,1);
      response.fields[fieldIndex]=selection;
    }
    persist();
    if(kind!=='field')render();
  }
  function ready(q,r){
    const c=q.interaction,a=r.response;
    if(c.kind==='single')return Number.isInteger(a.choice);
    if(c.kind==='multi'||c.kind==='diagram')return a.selected.length>0;
    if(c.kind==='sort')return a.buckets.every(x=>x!==null);
    if(c.kind==='match')return a.matches.every(x=>x!==null);
    return c.fields.every((f,i)=>f.kind==='selectStatements'?Array.isArray(a.fields[i])&&a.fields[i].length>0:String(a.fields[i]??'').trim().length>0);
  }
  function submit(){
    const q=current(),r=getRecord();if(!r||!['answering','coaching'].includes(r.status)||!ready(q,r))return;
    syncTime();
    if(E.grade(q,r.response)) {
      r.score=(r.mistakes>=2||r.timedOut)?0:E.pointScore(sec(r.elapsedMs),r.mistakes);
      r.solved=true;r.status='correct';startTick=0;
    }else if(r.mistakes===0&&!r.timedOut){
      r.mistakes=1;r.helpCount=1;r.status='hint';r.response=E.emptyAnswer(q.interaction);startTick=0;
    }else{
      if(r.mistakes===1)r.mistakes=2;else r.extraTries+=1;
      r.status='coaching';r.score=0;r.response=E.emptyAnswer(q.interaction);startTick=0;
    }
    persist();render();
  }
  function finish(){
    syncTime();const quiz=state.quiz;
    const done=quiz.ids.every(id=>quiz.records[id].solved);
    if(!done)return;
    const results=quiz.ids.map(id=>({id,...quiz.records[id]}));
    const scores=E.report(results);
    state.history[quiz.knowledge].push({date:new Date().toISOString(),firstScore:state.history[quiz.knowledge].length===0?scores.total:state.history[quiz.knowledge][0].firstScore,score:scores.total,questions:quiz.ids.slice(),results});
    state.mode='results';persist();render();
    sendCompletion(quiz.knowledge,results);
  }
  function advance(){
    const r=getRecord();if(!r||!r.solved)return;
    if(state.quiz.index===state.quiz.ids.length-1){finish();return;}
    state.quiz.index++;
    const next=getRecord();startTick=next.status==='answering'?Date.now():0;
    persist();render();
  }
  function home(){
    syncTime();
    const r=getRecord();
    if(state.mode==='quiz' && r && r.status==='answering')r.status='paused';
    state.mode='home';startTick=0;persist();render();
  }
  function continueQuiz(){
    if(!state.quiz || state.quiz.ids.every(id=>state.quiz.records[id].solved))return;
    state.mode='quiz';startTick=0;
    const r=getRecord();
    if(r.status==='answering')r.status='paused';
    persist();render();
  }
  function shell(content){
    app.innerHTML=`<main class="shell"><div class="top"><div class="brand"><strong>TOÁN 6</strong> / Kết nối tri thức</div><span class="pill">Bài 1 · Tập hợp</span></div>${content}<footer class="footer">Ngân hàng 50 câu v0.5.4 · Lưu tiến độ trên trình duyệt của thiết bị · Chỉ dùng cho tự học và kiểm duyệt học liệu. Không gửi thông tin ra máy chủ.</footer></main>`;
  }
  function homeHTML(){
    const pending=state.quiz && state.quiz.ids.some(id=>!state.quiz.records[id].solved);
    const activeQuiz=pending?state.quiz:null;
    const cards=[{
      title:'Kiến thức nền 1',sub:'Tập hợp và phần tử',body:'Một tập hợp gồm các phần tử xác định. Ta dùng chữ in hoa để đặt tên tập hợp và dùng kí hiệu ∈ (thuộc), ∉ (không thuộc) để xét phần tử.',example:'A = {bút chì; thước; tẩy}. Khi đó: bút chì ∈ A; kéo ∉ A.',tags:['A = {1; 3; 5}','3 ∈ A','4 ∉ A']
    },{
      title:'Kiến thức nền 2',sub:'Hai cách mô tả tập hợp',body:'Có thể liệt kê các phần tử trong dấu ngoặc nhọn hoặc nêu dấu hiệu đặc trưng. Thứ tự liệt kê không ảnh hưởng đến tập hợp và không viết lặp phần tử.',example:'B = {2; 4; 6} hoặc B = {n ∈ ℕ | n chẵn, 1 < n < 7}. Nhớ rằng 0 ∈ ℕ nhưng 0 ∉ ℕ*.',tags:['{2; 4; 6}','Liệt kê','Dấu hiệu đặc trưng']
    }];
    const ready=state.learned.every(Boolean);
    return `<header class="hero"><h1>Tập hợp – học bằng tương tác</h1><p class="lead muted">Đọc hai thẻ kiến thức, sau đó luyện tập và kiểm tra theo từng kiến thức nền.</p></header>
      <div class="content">${cards.map((x,i)=>`<section class="card learning knowledge"><div class="row"><div><div class="brand">${x.title}</div><h2>${x.sub}</h2></div><span class="${state.learned[i]?'status':'status pending'}">${state.learned[i]?'Đã học':'Chưa học'}</span></div><p>${x.body}</p><div class="ex">${x.example}</div><div class="mini">${x.tags.map(t=>`<span>${t}</span>`).join('')}</div><button class="button ${state.learned[i]?'secondary':''}" data-action="learn" data-index="${i}" ${state.learned[i]?'disabled':''}>${state.learned[i]?'Đã hoàn thành':'Tôi đã đọc và hiểu'}</button></section>`).join('')}
      ${activeQuiz?`<section class="card"><h2>Đề đang làm dở</h2><p class="muted">Kiến thức nền ${activeQuiz.knowledge} · Câu ${activeQuiz.index+1}/10 · Đã lưu câu trả lời và điểm. Đồng hồ đang tạm dừng.</p><button class="button" data-action="continue">Tiếp tục đề đã lưu</button></section>`:''}
      <section class="card"><h2>Kiểm tra kiến thức</h2><p class="muted">Mỗi đề gồm 10 câu rút ngẫu nhiên: <strong>6 luyện tập + 4 vận dụng</strong>. Mỗi kiến thức có ngân hàng riêng 25 câu. Câu không lặp trong một lượt.</p><div class="actions"><button class="button" data-action="begin" data-knowledge="1" ${!ready?'disabled':''}>Kiểm tra kiến thức 1</button><button class="button secondary" data-action="begin" data-knowledge="2" ${!ready?'disabled':''}>Kiểm tra kiến thức 2</button></div>${!ready?'<p class="small warn">Cần hoàn thành cả hai thẻ kiến thức để mở bài kiểm tra.</p>':''}<p class="muted small">Chấm điểm: 10 giây đầu không trừ; sau đó mỗi 10 giây hoàn chỉnh trừ 10 điểm. Sai lần 1 trừ 50 điểm và được gợi ý; sai lần 2 còn 0 điểm nhưng vẫn được hướng dẫn đến khi trả lời đúng.</p></section>
      ${[1,2].map(k=>{const a=state.history[k]||[];const best=a.length?Math.max(...a.map(x=>x.score)):null;return `<section class="card"><div class="row"><h3>Thành tích kiến thức ${k}</h3><span class="tag">${a.length} lượt kiểm tra</span></div><p class="muted">Lần đầu: <strong>${a.length?a[0].score+'/1000':'Chưa có'}</strong> · Tốt nhất: <strong>${best===null?'Chưa có':best+'/1000'}</strong></p></section>`;}).join('')}</div>`;
  }
  function visualHTML(q){
    const v=q.visual;if(!v)return '';
    if(v.kind==='set'){
      const tags=items=>items.map(x=>`<span class="set-token">${escapeHTML(x)}</span>`).join('');
      return `<figure class="set-visual" role="group" aria-label="Sơ đồ tập hợp ${escapeHTML(v.label)}"><figcaption>Quan sát sơ đồ ${escapeHTML(v.label)}</figcaption><div class="set-map"><div class="set-ring"><span class="set-name">${escapeHTML(v.label)}</span>${tags(v.inside)}</div><div class="set-exterior"><small>Ngoài đường bao</small>${tags(v.outside)}</div></div></figure>`;
    }
    if(v.kind==='numberline'){
      return `<figure class="number-visual" role="group" aria-label="Trục số"><figcaption>Trục số tham khảo</figcaption><div class="number-ticks" style="--tick-count:${v.ticks.length}">${v.ticks.map(t=>`<span>${escapeHTML(t)}</span>`).join('')}</div></figure>`;
    }
    return '';
  }
  function answerHTML(q,r){
    const c=q.interaction,a=r.response;
    if(c.kind==='single')return `<div class="option-grid" role="group" aria-label="Chọn một đáp án">${c.options.map((v,i)=>`<button class="option ${a.choice===i?'selected':''}" data-action="pick" data-value="${i}" aria-pressed="${a.choice===i}"><span class="option-letter" aria-hidden="true">(${String.fromCharCode(97+i)})</span>${escapeHTML(v)}</button>`).join('')}</div>`;
    if(c.kind==='multi'||c.kind==='diagram')return `<div class="option-grid ${c.kind==='diagram'?'diagram':''}" role="group" aria-label="Chạm để chọn các phần tử">${c.options.map((v,i)=>`<button class="option ${a.selected.includes(i)?'selected':''}" data-action="toggle" data-value="${i}" aria-pressed="${a.selected.includes(i)}">${escapeHTML(v)}</button>`).join('')}</div><p class="muted small">Có thể chọn nhiều thẻ. Nhấn lại thẻ để bỏ chọn.</p>`;
    if(c.kind==='sort')return `<p class="small muted">Chạm vào ô thuộc hoặc không thuộc bên cạnh mỗi thẻ (có thể dùng trên điện thoại thay cho kéo thả).</p><div class="group"><section><h4>${escapeHTML(c.inside_label)}</h4><div class="tiles">${c.options.map((v,i)=>`<button class="tile ${a.buckets[i]==='in'?'active':''}" data-action="bucket" data-value="${i}" data-bucket="in">${escapeHTML(v)} ${a.buckets[i]==='in'?'✓':''}</button>`).join('')}</div></section><section><h4>${escapeHTML(c.outside_label)}</h4><div class="tiles">${c.options.map((v,i)=>`<button class="tile ${a.buckets[i]==='out'?'out':''}" data-action="bucket" data-value="${i}" data-bucket="out">${escapeHTML(v)} ${a.buckets[i]==='out'?'✓':''}</button>`).join('')}</div></section></div>`;
    if(c.kind==='match')return `<div role="group" aria-label="Ghép cặp">${c.left.map((v,i)=>`<label class="match-row"><strong>${escapeHTML(v)}</strong><select data-match="${i}"><option value="">-- Chọn đáp án --</option>${c.options.map((o,j)=>`<option value="${j}" ${a.matches[i]===j?'selected':''}>${escapeHTML(o)}</option>`).join('')}</select></label>`).join('')}</div>`;
    return `<div>${c.fields.map((f,i)=>f.kind==='selectStatements'
      ?`<section class="text-field" aria-labelledby="statement-label-${i}"><strong id="statement-label-${i}">${escapeHTML(f.label)}</strong><p class="small muted">Có thể có nhiều cách mô tả tương đương. Chạm vào tất cả câu đúng; nhấn lại để bỏ chọn.</p><div class="option-grid statement-grid" role="group" aria-labelledby="statement-label-${i}">${f.options.map((v,j)=>{const selected=Array.isArray(a.fields[i])&&a.fields[i].includes(j);return `<button type="button" class="option statement-option ${selected?'selected':''}" data-action="fieldStatement" data-field-index="${i}" data-value="${j}" aria-pressed="${selected}"><span class="choice-mark" aria-hidden="true">${selected?'✓':''}</span><span><span class="option-letter">(${String.fromCharCode(97+j)})</span>${escapeHTML(v)}</span></button>`;}).join('')}</div></section>`
      :`<label class="text-field"><strong>${escapeHTML(f.label)}</strong><input data-field="${i}" type="text" inputmode="text" autocomplete="off" spellcheck="false" value="${escapeHTML(a.fields[i]||'')}" placeholder="Nhập đáp án" aria-label="${escapeHTML(f.label)}" /></label>`).join('')}</div><div class="symbol-buttons"><span class="small muted">Kí hiệu nhanh (ô đang chọn):</span><button data-action="symbol" data-value="∈">∈</button><button data-action="symbol" data-value="∉">∉</button><button data-action="symbol" data-value="{">{</button><button data-action="symbol" data-value="}">}</button><button data-action="symbol" data-value=";">;</button><button data-action="symbol" data-value="&lt;">&lt;</button><button data-action="symbol" data-value="&gt;">&gt;</button><button data-action="symbol" data-value="≤">≤</button><button data-action="symbol" data-value="≥">≥</button></div>`;
  }
  function feedbackHTML(q,r){
    if(r.status==='hint')return `<div class="feedback bad" role="status"><h3>Sai lần 1: trừ 50 điểm</h3><p><strong>Gợi ý:</strong> ${escapeHTML(q.hint)}</p><p class="muted small">Đồng hồ đang tạm dừng. Không trừ thêm điểm khi đọc gợi ý.</p><button class="button" data-action="retry">Đã hiểu – trả lời lại</button></div>`;
    if(r.status==='coaching')return `<div class="feedback" role="status"><h3>${r.timedOut?'Hết thời gian chấm điểm (110 giây) – 0 điểm':'Sai 2 lần – 0 điểm'}</h3><p><strong>Hướng dẫn:</strong> ${escapeHTML(q.explanation)}</p><p><strong>Lỗi thường gặp:</strong> ${escapeHTML(q.common_error)}</p><p class="muted small">Điểm câu này đã khóa ở 0. Em vẫn được trả lời tiếp cho đến khi đúng.</p>${r.timedOut?'': ''}</div>`;
    if(r.status==='correct')return `<div class="feedback good" role="status"><h3>${r.score>0?'Chính xác!':'Đã tìm được đáp án đúng – 0 điểm'}</h3><p><strong>Đáp án:</strong> ${escapeHTML(q.answer)}</p><p><strong>Giải thích:</strong> ${escapeHTML(q.explanation)}</p><p><strong>Điểm câu:</strong> ${r.score}/100${r.mistakes>=2?' · Sai 2 lần – 0 điểm':''}</p></div>`;
    if(r.status==='paused')return `<div class="feedback"><h3>Bài đang tạm dừng</h3><p>Tiến độ đã lưu. Nhấn tiếp tục để đồng hồ bắt đầu chạy lại.</p><button class="button" data-action="retry">Tiếp tục câu hỏi</button></div>`;
    return '';
  }
  function quizHTML(){
    const quiz=state.quiz,q=current(),r=getRecord();
    const elapsedS=sec(elapsed()),remaining=Math.max(0,E.LIMIT_SECONDS-elapsedS),locked=r.mistakes>=2||r.timedOut;
    const clockLabel=locked?'Đã dừng':r.status==='hint'||r.status==='paused'?'Tạm dừng':`${Math.ceil(remaining)}s`;
    const nowScore=r.solved?r.score:E.pointScore(elapsedS,r.mistakes);
    const canAnswer=['answering','coaching'].includes(r.status);
    const solvedCount=quiz.ids.filter(id=>quiz.records[id].solved).length;
    return `<div class="hero"><div class="row"><div><span class="brand">Kiến thức nền ${quiz.knowledge} · Bài kiểm tra</span><h1>Câu ${quiz.index+1} / ${quiz.ids.length}</h1></div><button class="button secondary" data-action="home">Trang chủ</button></div><div class="meter"><i style="width:${solvedCount*10}%"></i></div><div class="scorebar"><div class="stat"><b id="timer">${clockLabel}</b><span>Đồng hồ chấm điểm</span></div><div class="stat"><b id="points">${nowScore}</b><span>Điểm hiện tại / 100</span></div><div class="stat"><b>${r.mistakes}</b><span>Lần trả lời sai</span></div></div></div>
    <section class="card"><div class="meta"><span class="tag">${escapeHTML(q.id)}</span><span class="tag">${escapeHTML(q.level)}</span><span class="tag">${escapeHTML(q.mode)}</span></div><h2 class="question-title">${escapeHTML(q.idea)}</h2><p class="prompt">${escapeHTML(q.prompt)}</p>${visualHTML(q)}<div id="answer-controls" ${canAnswer?'':'inert'}>${answerHTML(q,r)}</div>${feedbackHTML(q,r)}
    <div class="actions">${canAnswer?`<button class="button" data-action="submit" ${ready(q,r)?'':'disabled'}>Kiểm tra đáp án</button>`:''}${r.status==='correct'?`<button class="button green" data-action="next">${quiz.index===9?'Xem kết quả':'Câu tiếp theo'}</button>`:''}</div>${locked&&canAnswer?'<p class="warn small">Đồng hồ chấm điểm đã dừng. Trả lời đúng để chuyển sang câu tiếp theo.</p>':''}</section>`;
  }
  function resultsHTML(){
    const q=state.quiz;const res=q.ids.map(id=>({id,...q.records[id]}));const summary=E.report(res);const hist=state.history[q.knowledge];const best=Math.max(...hist.map(x=>x.score));
    return `<header class="hero"><div class="brand">Đã hoàn thành bài kiểm tra</div><h1 class="summary-title">${summary.total} / ${summary.max} điểm</h1><p class="lead muted">Kiến thức nền ${q.knowledge} · ${summary.percent}% · Lần đầu ${hist[0].score}/1000 · Tốt nhất ${best}/1000</p></header><div class="content"><section class="card"><h2>Chi tiết 10 câu</h2>${res.map(r=>{const item=byId(r.id);return `<div class="result-row"><div><b>${escapeHTML(item.id)} · ${escapeHTML(item.idea)}</b><div class="small muted">${escapeHTML(item.level)} · ${Math.round(r.elapsedMs/1000)} giây · Sai ${r.mistakes} lần · Gợi ý ${r.helpCount} lần</div>${r.mistakes>=2?'<div class="small warn">Sai 2 lần – 0 điểm</div>':''}</div><strong>${r.score}/100</strong></div>`}).join('')}</section><section class="card"><p>Tổng điểm: <strong>${summary.total}/1000</strong>. Câu sai 2 lần: <strong>${summary.zeroAfterSecondError}</strong>. Câu đã hoàn thành: <strong>10/10</strong>.</p><div class="actions"><button class="button" data-action="begin" data-knowledge="${q.knowledge}">Tạo đề mới (10 câu khác)</button><button class="button secondary" data-action="home">Về trang chủ</button></div></section></div>`;
  }
  function render(){
    lastFocusedFieldIndex=null; // A new question should not inherit the old field.
    if(state.mode==='quiz' && !state.quiz){state.mode='home';}
    if(state.mode==='results' && !state.quiz){state.mode='home';}
    shell(state.mode==='quiz'?quizHTML():state.mode==='results'?resultsHTML():homeHTML());
  }
  app.addEventListener('focusin',event=>{
    const input=event.target;
    if(input.matches('input[data-field]'))lastFocusedFieldIndex=input.dataset.field;
  });
  app.addEventListener('click',event=>{
    const button=event.target.closest('[data-action]');if(!button)return;
    const action=button.dataset.action,val=button.dataset.value;
    if(action==='learn'){state.learned[Number(button.dataset.index)]=true;persist();render();}
    if(action==='begin')begin(Number(button.dataset.knowledge));
    if(action==='home')home();
    if(action==='continue')continueQuiz();
    if(action==='pick')updateAnswer('choice',val);
    if(action==='toggle')updateAnswer('selected',val);
    if(action==='fieldStatement')updateAnswer('fieldStatement',button.dataset.fieldIndex,val);
    if(action==='bucket')updateAnswer('bucket',val,button.dataset.bucket);
    if(action==='submit')submit();
    if(action==='retry')resume();
    if(action==='next')advance();
    if(action==='symbol'){
      // The symbol button steals focus. Track the last input instead of
      // defaulting to the first field on multi-part questions.
      const input=(lastFocusedFieldIndex===null?null:app.querySelector(`input[data-field="${lastFocusedFieldIndex}"]`))
        ||app.querySelector('input[data-field]:focus')||app.querySelector('input[data-field]');
      if(!input)return;
      const selection=input.selectionStart??input.value.length;
      const end=input.selectionEnd??selection;
      const txt=input.value;
      input.value=txt.slice(0,selection)+val+txt.slice(end);
      input.focus();input.setSelectionRange(selection+val.length,selection+val.length);
      updateAnswer('field',input.dataset.field,input.value);
      const submitBtn=app.querySelector('[data-action="submit"]');if(submitBtn)submitBtn.disabled=!ready(current(),getRecord());
    }
  });
  app.addEventListener('input',event=>{
    const t=event.target;if(!t.matches('input[data-field]'))return;
    updateAnswer('field',t.dataset.field,t.value);
    const button=app.querySelector('[data-action="submit"]');if(button)button.disabled=!ready(current(),getRecord());
  });
  app.addEventListener('change',event=>{
    const t=event.target;if(!t.matches('select[data-match]'))return;
    updateAnswer('match',t.dataset.match,t.value);
  });
  document.addEventListener('visibilitychange',()=>{
    // A hidden tab is treated as a pause to avoid penalizing pupils for app switching.
    if(state.mode!=='quiz')return;
    const r=getRecord();if(!r)return;
    if(document.hidden && r.status==='answering'){
      syncTime();if(r.status==='answering')r.status='paused';persist();render();
    }
  });
  setInterval(()=>{
    if(state.mode!=='quiz')return;
    const r=getRecord();if(!r||r.status!=='answering')return;
    const t=sec(elapsed());
    if(t>=E.LIMIT_SECONDS){syncTime();persist();render();return;}
    const timeNode=document.getElementById('timer'),pointsNode=document.getElementById('points');
    if(timeNode)timeNode.textContent=Math.ceil(Math.max(0,E.LIMIT_SECONDS-t))+'s';
    if(pointsNode)pointsNode.textContent=String(E.pointScore(t,r.mistakes));
    // Save the active clock once a second without restarting the timer.
    const accumulated=elapsed();r.elapsedMs=accumulated;startTick=Date.now();persist();
  },1000);
  render();
  // Resend each local best to the authenticated host. SQLite keeps the
  // highest score; this makes completion syncing retryable after a network loss.
  if(validStudent && window.parent!==window){
    [1,2].forEach(knowledge=>{
      const runs=state.history[knowledge]||[];
      const best=runs.reduce((a,b)=>!a||b.score>a.score?b:a,null);
      if(best?.results)sendCompletion(knowledge,best.results);
    });
  }
  if(state.mode==='quiz' && getRecord()?.status==='answering') startTick=Date.now();
})();

</script>
<script>
(function () {
  if(window.parent===window)return;
  const sendHeight=()=>{const height=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);
    window.parent.postMessage({source:'math6-bai1-v054',kind:'resize',height},window.location.origin);};
  if('ResizeObserver' in window) new ResizeObserver(sendHeight).observe(document.getElementById('app'));
  window.addEventListener('load',sendHeight);
  window.addEventListener('resize',sendHeight);
  setTimeout(sendHeight,200);
})();
</script>
</body>
