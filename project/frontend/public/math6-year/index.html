<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toán 6 – Luyện tập theo bài học</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#172a4c;background:#f6f8fc;line-height:1.55}
*{box-sizing:border-box}body{margin:0}#math-app{max-width:960px;margin:0 auto;padding:12px}
h1{font-size:clamp(1.5rem,3vw,2.05rem);line-height:1.3;margin:9px 0}h2{font-size:1.3rem;margin:13px 0}h3{font-size:1.07rem}
p{margin:10px 0 15px}.header,.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{border-radius:999px;padding:6px 12px;background:#e9eff8;color:#50627e;font-size:.85rem;font-weight:700}
.muted,.sub{color:#526684}.sub{margin:0 0 17px}.card,.details,.notice{border:1px solid #dce5f2;background:#fff;border-radius:15px;padding:19px;margin:12px 0;box-shadow:0 6px 24px rgba(10,27,65,.03)}
.details{background:#f1f6ff}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.cards .card{margin:0}
.teaching{background:#fff8df;border-color:#e7d18e}.reading{max-height:300px;overflow:auto;overscroll-behavior:contain;background:#fff;border:1px solid #d6cda7;border-radius:11px;padding:16px;margin:15px 0}
button,input{font:inherit;min-height:44px}
button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid #e3b22c;outline-offset:2px}
.primary,.secondary{border-radius:10px;padding:10px 17px;border:1px solid #b8c9e1;font-weight:700}
.primary{background:#174786;border-color:#174786;color:#fff}
.secondary{background:#f2f6fd;color:#254b7a}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.question .problem{font-size:clamp(1.08rem,2.7vw,1.42rem);line-height:1.6;margin:25px 0 20px}
.progress{margin:17px 0;background:#e9effa;border-radius:8px;height:8px;overflow:hidden}.progress span{height:100%;display:block;background:#e7bd53}
.control-label{font-weight:750;display:block;margin:13px 0 8px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.option{background:#f9fbff;text-align:left;border:1.5px solid #c4d5ec;border-radius:11px;padding:14px;color:#193458;min-width:0;overflow-wrap:anywhere}
.option.chosen{background:#fff1c4;border-color:#dfa52a;box-shadow:0 0 0 2px #dfa52a}
#response{width:100%;min-height:56px;border:2px solid #c4d3e9;border-radius:11px;padding:13px 15px;font-size:1.15rem;color:#173252}
.score-line{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin:19px 0 9px;padding-top:14px;border-top:1px solid #dce5f2}
.feedback,.notice{background:#fff2d3;border-color:#dfbf65}.feedback{border:1px solid #dfbf65;border-radius:12px;padding:14px;margin:18px 0}
.feedback.good{background:#eaf8f0;border-color:#abd9bf}
table{border-collapse:collapse;width:100%;max-width:540px}th,td{text-align:left;padding:7px 10px;border-bottom:1px solid #dce4ef}
.super{font-size:1.9rem;font-weight:850;color:#1b508d}
footer{text-align:center;color:#6a7c94;font-size:.82rem;margin:22px 0}
@media(max-width:640px){#math-app{padding:9px}.card,.details,.notice{padding:15px}.cards,.options{grid-template-columns:1fr}.super{font-size:1.4rem}}
</style></head>
<body><main id="math-app" aria-label="Bài luyện tập Toán lớp 6"></main>
<script type="module" src="./app.mjs"></script>
</body></html>
