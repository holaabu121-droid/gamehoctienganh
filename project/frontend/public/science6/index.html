<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản mẫu Khoa học tự nhiên 6 – 55 bài</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#18324a;background:#f4f8f7;line-height:1.58}*{box-sizing:border-box}body{margin:0}#science-root{max-width:1060px;margin:auto;padding:13px}
h1{font-size:clamp(1.55rem,3.1vw,2.4rem);line-height:1.28;margin:9px 0}h2{font-size:1.24rem;line-height:1.36}
header{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 3px 17px}
.version{margin-left:8px;font-size:.82rem;color:#58736a}
.draft{font-size:.77rem;letter-spacing:.025em;padding:6px 11px;background:#fff0cd;color:#775319;border-radius:14px;font-weight:750}
.intro,.chapter,.lesson-header,.learning,.practice{border-radius:17px;border:1px solid #d3e2da;background:#fff;box-shadow:0 6px 22px rgba(16,46,37,.035);padding:20px;margin-bottom:12px}
.intro{background:linear-gradient(125deg,#d9f1e5,#fff 65%)}
.eyebrow{font-size:.85rem;color:#23664c;font-weight:800;letter-spacing:.03em}
.chapter h2{margin-top:0;color:#164f3d}
.lessons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.lesson-link{text-align:left;color:inherit;background:#f7fbf9;border:1px solid #c9ddd3;border-radius:11px;padding:13px 15px;min-height:75px}
.lesson-link b{font-weight:760;display:block;line-height:1.38}
.lesson-link span{font-size:.83rem;color:#637a73;display:block;margin-top:4px}
.lesson-header p{margin-bottom:0;color:#63736c}
.label{display:inline-block;margin-left:10px;font-size:.88rem;color:#596f69}
.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-top:19px}
button,select{font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,select:focus-visible{outline:3px solid #b98a21;outline-offset:2px}
.outline,.active,.primary{border:1px solid #b5cfc4;border-radius:10px;padding:10px 16px;min-height:44px;font-weight:720}
.outline{color:#215b49;background:#f5faf8}
.active,.primary{color:#fff;background:#176e53;border-color:#176e53}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.learning{background:#fef8de;border-color:#e8cd78}
.learning h2{color:#795b1e}
.readbox{max-height:280px;overflow:auto;border:1px solid #dfd2a7;background:#fff;border-radius:11px;padding:15px 17px}
.readbox ul{padding-left:19px;margin:4px 0}
.readbox li{margin:8px 0}
.subdued{color:#65776e;font-size:.89rem}
.exer-meta{display:flex;gap:7px;flex-wrap:wrap}
.exer-meta span{border-radius:13px;padding:5px 11px;color:#546f64;background:#eaf3ed;font-size:.82rem;font-weight:740}
.practice h2{font-size:1.34rem;margin:22px 0}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.option{border:1.5px solid #b8d4c7;background:#f9fdfb;color:#193d31;text-align:left;padding:13px 15px;min-height:54px;border-radius:11px;overflow-wrap:anywhere}
.option.selected{background:#ffedb7;border-color:#b48623;box-shadow:0 0 0 2px #b48623}
.match{display:grid;gap:10px}.match label{display:grid;grid-template-columns:minmax(100px,1fr) minmax(130px,2fr);gap:10px;align-items:center;border:1px solid #dae8e1;border-radius:10px;padding:10px}
.match label span{font-weight:750}
.match select{width:100%;min-width:0;min-height:48px;padding:9px;border:1px solid #a9c8ba;border-radius:9px;background:#fff}
.feedback{border:1px solid #e2cb7b;background:#fff4d2;padding:12px;border-radius:12px;margin-top:16px}
.feedback.correct{background:#e7f6ec;border-color:#9dd5b1}
.error{color:#8f371b;padding:11px;border-radius:11px;background:#fff0e9;border:1px solid #e8b19f}
footer{text-align:center;color:#70847c;font-size:.78rem;margin-top:23px}
@media(max-width:650px){#science-root{padding:9px}.intro,.chapter,.lesson-header,.learning,.practice{padding:16px}.lessons,.choices{grid-template-columns:1fr}.match label{grid-template-columns:1fr}}
</style></head>
<body><main id="science-root" aria-label="Thiết kế Khoa học tự nhiên 6"></main><script type="module" src="./preview.mjs"></script></body></html>
